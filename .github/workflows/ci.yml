name: CI

on:
  push:
    branches: [main, "feat/*", "fix/*", "docs/*", "build/*", "test/*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libgl-dev

      - name: Build
        run: zig build

      - name: Test
        run: zig build test
